# Referencia do vhost em producao (/etc/nginx/sites-enabled/panda.mindhouse.cloud.conf).
# O bloco 443 e gerado pelo certbot; aqui ficam so as partes mantidas a mao.

# --- dentro de server { listen 443 ... } ---
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://panda.mindhouse.cloud wss://panda.mindhouse.cloud; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Arquivos enviados (storage) ficam na mesma origem do app: nunca executar script a partir deles.
location /supabase/storage/v1/object/ {
    proxy_pass http://127.0.0.1:8100/storage/v1/object/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
}
