name: Deploy (front)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STORAGE_BUCKET: uploads

      - name: Validar build
        run: test -f dist/index.html

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Migrations ANTES de publicar o front: se falhar, o deploy aborta e o site antigo continua no ar.
      - name: Aplicar migrations do banco
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          SSH_OPTS: -i /home/runner/.ssh/id_deploy -o StrictHostKeyChecking=yes
          DB_CONTAINER: supabase-db
        run: scripts/apply-migrations.sh

      - name: Enviar build (rsync → staging)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:/var/www/panda.staging/"

      - name: Swap atômico
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            BASE=/var/www
            LIVE="$BASE/panda"
            STAGING="$BASE/panda.staging"
            OLD="$BASE/panda.old"
            test -f "$STAGING/index.html" || { echo "✖ staging inválido"; exit 1; }
            rm -rf "$OLD"
            if [ -d "$LIVE" ]; then mv "$LIVE" "$OLD"; fi
            mv "$STAGING" "$LIVE"
            if [ ! -f "$LIVE/index.html" ]; then
              rm -rf "$LIVE"; [ -d "$OLD" ] && mv "$OLD" "$LIVE"; exit 1
            fi
            echo "✔ Publicado — $(find "$LIVE" -type f | wc -l) arquivos"
